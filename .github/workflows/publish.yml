name: 승인 관측 예보 갱신 및 Pages 배포
on:
  push:
    branches: [main]
    paths:
      - data/observations/official.csv
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.weekly forecast
      - run: python -m src.weekly score
      - name: 예측과 사이트 데이터 보존
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/predictions data/site
          if ! git diff --cached --quiet; then
            git commit -m 'data: 운영 예보 스냅샷과 실전 기록 갱신'
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run test -- --run && npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4

name: 공식 공지 수집 PR
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: weekly-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
      VISION_PROVIDER: gemini
      VISION_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/interim/vision_cache
          key: vision-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vision-${{ runner.os }}-
      - run: python -m src.weekly collect
      - name: 미검토 데이터 PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw/official data/observations
          if git diff --cached --quiet; then
            echo '신규 행 없음'
            exit 0
          fi
          branch="automation/official-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m 'data: 미검토 공식 공지 추출'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title '공식 공지 추출 검토 요청' --body-file data/interim/weekly_summary.md
